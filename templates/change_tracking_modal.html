<!-- Change Tracking Modal -->
<div id="change-tracking-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📝 Record Change Details</h3>
            <button class="modal-close" onclick="closeChangeModal()">&times;</button>
        </div>
        
        <div class="modal-body">
            <form id="change-tracking-form">
                <!-- Change Type Selection -->
                <div class="form-group">
                    <label><strong>Change Type:</strong></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="change_type" value="internal" onchange="toggleChangeReason()">
                            <span>🏢 Internal</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="change_type" value="external" onchange="toggleChangeReason()">
                            <span>👤 External (Customer Request)</span>
                        </label>
                    </div>
                </div>

                <!-- Internal Change Reason -->
                <div id="internal-reason-section" class="form-group" style="display: none;">
                    <label for="change-reason"><strong>Internal Reason:</strong></label>
                    <select id="change-reason" name="change_reason">
                        <option value="">Select reason...</option>
                        <option value="manual_error">Manual Error</option>
                        <option value="boss_change">Boss Change</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Other Reason Detail (for internal "other") -->
                <div id="other-reason-section" class="form-group" style="display: none;">
                    <label for="other-reason-detail"><strong>Please specify:</strong></label>
                    <textarea id="other-reason-detail" name="other_reason_detail" 
                              placeholder="Enter details (max 50 words)..." 
                              maxlength="500" rows="2"></textarea>
                    <small class="word-count">0/50 words</small>
                </div>

                <!-- External Proof Section -->
                <div id="external-proof-section" class="form-group" style="display: none;">
                    <label><strong>Customer Request Proof:</strong></label>
                    
                    <!-- Text Proof -->
                    <div class="proof-subsection">
                        <label for="proof-text">Copy/Paste Customer Request:</label>
                        <textarea id="proof-text" name="proof_text" 
                                  placeholder="Paste customer email, message, or request details here (max 50 words)..." 
                                  maxlength="500" rows="3"></textarea>
                        <small class="word-count">0/50 words</small>
                    </div>

                    <!-- File Upload -->
                    <div class="proof-subsection">
                        <label>Upload Supporting Files:</label>
                        <div class="file-upload-area" id="file-upload-area">
                            <input type="file" id="proof-files" name="proof_files" 
                                   multiple accept=".jpg,.jpeg,.png,.gif,.pdf,.eml,.msg" 
                                   onchange="handleFileUpload(event)">
                            <div class="upload-text">
                                📎 Click to browse or drag files here<br>
                                <small>Supported: Images (JPG, PNG, GIF), PDF, Email files</small>
                            </div>
                        </div>
                        <div id="uploaded-files-list"></div>
                    </div>
                </div>

                <!-- Changes Summary -->
                <div class="form-group">
                    <label><strong>Changes to be recorded:</strong></label>
                    <div id="changes-summary" class="changes-summary">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>
            </form>
        </div>
        
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeChangeModal()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="saveChanges()" id="save-changes-btn" disabled>
                💾 Save Changes
            </button>
        </div>
    </div>
</div>
